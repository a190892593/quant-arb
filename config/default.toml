# ARBX 本地运行配置（真实链只读扫描 + Paper 账本；无真实下单/广播/签名?#
# 修改后重?`arb-backend` 生效。所有金额单?USDC，费率单?bps（万分之一）?# 本文件不包含任何密钥；第一阶段不需?CEX 下单 API Key
[server]
host = "127.0.0.1"
# 8787 已被本机其他服务占用，默认改?8791；可?ARBX_PORT 覆盖
port = 8791
ui_dir = "ui"
cors = true

[data]
dir = "data"
db_file = "arbx.db"
keep_opportunities = 2000
keep_risk_events = 5000

[paper]
# 审计资金基准 5,000 USDC（风?§3
start_equity = 5000.0
# DEX / CEX 资金分配?0:50 只是对比基准，不是最优结论（PRD §2.1
dex_share = 0.5
# 扫描周期
scan_interval_ms = 1500
# 机会有效期上?30 秒（风控 §5
opportunity_ttl_sec = 30
# 真实链阶段不自动“执行”：Paper 执行使用实时行情，但不应被误读为真实成交
auto_execute = false
# 每轮扫描命中可执行机会后的执行概率（避免每轮都成交）
execute_probability = 0.5
# 研究规模档位（PRD §2.1?50?0,000 USDC 分档测试
notional_ladder = [250.0, 500.0, 1000.0, 2500.0, 5000.0, 7500.0, 10000.0]
max_inflight = 3

[feed]
# 运行时只接受 live（真实链 RPC）。demo 仅供单元测试直接构造市场，服务不会启用
mode = "live"
seed = 20261119
# 真实链刷新周期（毫秒），实际?[live] refresh_ms 为准
tick_ms = 1000

[cex]
exchange = "binance"
symbols = ["ETHUSDT", "BTCUSDT", "ETHUSDC", "BTCUSDC", "GMXUSDT"]
# 现货 taker/maker 费率（配置声明值）。fee_confirmed=false 时风控会拒绝生成可执行机会
taker_bps = 7.5
maker_bps = 8.0
fee_confirmed = true
book_levels = 12

[dex]
# 以下?RPC 不可用时的兜底占位；运行时会被链?eth_gasPrice ?WETH 价格覆盖
gas_price_gwei = 0.02
native_price_usd = 2800.0
gas_per_hop = 130000
# 闪电贷费用必须来自实际协议数据；演示模式使用显式配置
flash_loan_fee_bps = 5.0
flash_provider = "aave-v3"

# DEX 多池多跳扫描引擎（PRD §4–?）。关?enabled 时回退旧版三角/跨池扫描
[dex_engine]
enabled = true
min_hops = 2
max_hops = 5
max_pools = 30
# 候选路?/ 访问?/ 单次搜索时间预算（PRD §4.4
max_candidates = 100000
# 单轮完整定价的候选上限与硬预算（防止上万条路线拖垮 1.5s 扫描周期）
max_evaluate = 800
max_evaluate_ms = 1200
max_visits = 200000
max_elapsed_ms = 250
# 投入金额范围与优化分辨率（PRD §5.4
min_input_usd = 100.0
max_input_usd = 5000.0
grid_points = 14
refine_iters = 16
# 池准入与容量（PRD §8
min_pool_tvl_usd = 25000.0
max_pool_state_age_ms = 8000
max_pool_share_pct = 10.0
# M3 压力模拟（PRD §6.1
stress_bps = 25.0
stress_gas_pct = 50.0
stress_flash_pct = 50.0
model_mismatch_max_bps = 50.0
# 增量扫描（PRD §9.2
requote_age_ms = 4000
full_rescan_blocks = 240
# Gas 估算分项（PRD §5.6
gas_executor_base = 45000
gas_executor_per_hop = 12000
gas_transfer_per_hop = 30000
gas_flash_loan = 90000
gas_approve = 50000
base_symbols = ["USDC", "USDT"]

# 真实链行情（RPC）。只允许 live；demo 仅供单元测试构造
[live]
# Real-chain feed (Arbitrum mainnet). Public RPC: ~1-2s per call.
chain_id = 42161
rpc_primary = "https://arb1.arbitrum.io/rpc"
rpc_fallback = "https://arbitrum-one.publicnode.com"
# 免费 RPC 池：失败自动切换，全部无需 Key
rpc_pool = ["https://arbitrum-one.publicnode.com"]
refresh_ms = 2000
max_pools = 30
# No REVM / M2: do not scan V3 tick bitmaps; quote single active range (M1).
tick_word_radius = 0
max_ticks_per_pool = 64
tick_top_pools = 3
tick_refresh_ms = 60000

